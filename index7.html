<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kesar Portfolio</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#0a0a0a;
    color:white;
}

/* HERO SECTION */

.hero{
    text-align:center;
    padding:60px 20px;
}

.hero img{
    width:180px;
    border-radius:50%;
}

.hire-btn{
    display:inline-block;
    margin-top:15px;
    padding:12px 30px;
    background:cyan;
    color:black;
    font-weight:bold;
    border-radius:25px;
    text-decoration:none;
}

/* ANIMATION TEXT */

.animation{
    font-size:32px;
    text-align:center;
    margin-top:40px;
    font-weight:bold;
    background:linear-gradient(90deg,cyan,white);
    -webkit-background-clip:text;
    color:transparent;
}

/* IRON MAN SECTION */

.ironman{
    text-align:center;
    padding:70px 20px;
}

.ironman h2{
    color:#00f7ff;
    letter-spacing:3px;
}

.ironman img{
    width:320px;
    max-width:90%;
    margin-top:30px;
    filter:drop-shadow(0 0 25px red);
    transition:0.5s;
}

.ironman img:hover{
    transform:scale(1.08);
    filter:drop-shadow(0 0 45px cyan);
}

/* WHITE BOX SECTIONS */

.section{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:25px;
    padding:50px 20px;
}

.box{
    width:260px;
    background:white;
    color:black;
    padding:25px;
    border-radius:20px;
    text-align:center;
}

</style>
</head>

<body>

<!-- HERO -->

<div class="hero">
    <img src="yourphoto.jpg" alt="Kesar Photo">

    <h1>Kesar Sooryavanshi</h1>

    <a href="#" class="hire-btn">HIRE ME</a>
</div>

<!-- ANIMATION TEXT -->

<div class="animation">
    WELCOME TO MY PORTFOLIO
</div>

<!-- IRON MAN ENTRY -->

<div class="ironman">

    <h2>IRON MAN ENTRY CINEMATIC MODE</h2>

    <img src="ironman.png" alt="Iron Man Full Body">

</div>

<!-- WHITE BOX SECTIONS -->

<div class="section">

    <div class="box">
        <h2>About Me</h2>
        <p>BTech student | Beginner Developer | Future Super App Creator</p>
    </div>

    <div class="box">
        <h2>Programming</h2>
        <p>C • Python • HTML • CSS • JavaScript</p>
    </div>

    <div class="box">
        <h2>Skills</h2>
        <p>Frontend Development<br>Problem Solving<br>Creative Design</p>
    </div>

</div>

</body>
</html>
